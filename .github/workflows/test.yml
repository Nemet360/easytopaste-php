name: tests

# The envelope this builds has to be byte-identical to the one four JavaScript
# clients build. The vector in tests/run.php was generated by the Node
# implementation; this is what proves PHP still agrees with it, on every
# supported version rather than on the one the author happened to have.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json
          coverage: none
      - run: php -l src/Crypto.php && php -l src/Link.php && php -l src/Client.php
      - run: php tests/run.php
